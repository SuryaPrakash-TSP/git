<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact</title>
</head>
<body>
    <header>
        <h2>Contact Us</h2>
    </header>

    <form action="#" method="post">
    
        
        <label for="name">Name</label>
        <input type="text" name="name" id="name" placeholder="Enter your name" required><br><br>
         <label for="email">Email</label>
        <input type="Email" name="Email" id="email" placeholder="Enter your name" required><br><br>
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter your password" required><br><br>
        <label><input type="radio" name="gender" value="Male">Male</label>
        <label><input type="radio" name="gender" value="Female">Female</label><br><br>
        <label for="message">Message</label>
        <textarea name="message" id="message" cols="15" rows="5" placeholder="Type the message"></textarea><br><br>
        <input type="submit" value="submit">
        </form>

        <footer>
            <p>Ecomerce. All rights are reserved</p>
        </footer>
    
</body>
</html>
